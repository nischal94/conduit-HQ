# CI pipeline draft — to activate:
#   mkdir -p .github/workflows && git mv .github/ci.draft.yml .github/workflows/ci.yml
# (Workflow files are deliberately not agent-writable on this machine; a human
# moves this into place. Review it like code — CI is a supply-chain surface.)
#
# THREAT MODEL (read before editing):
# - pull_request runs UNTRUSTED code. A PR can modify package scripts, test
#   files, pnpm-workspace.yaml (allowBuilds), and the lockfile — so every job
#   here is an unprivileged validation surface: read-only token, zero
#   `secrets.*` references, installs with --ignore-scripts, checkout
#   credentials not persisted.
# - NEVER switch any trigger to pull_request_target. Never add secrets, deploy
#   credentials, cloud creds, or publish tokens to this file. Privileged
#   workflows (publish, deploy) belong in a separate push/tag-triggered
#   workflow that never runs PR code.
# ACTIVATION CHECKLIST (do these in repo settings when this goes live —
# none of them can be configured from inside this file):
# 1. [DONE 2026-07-03] Every `uses:` and docker image below is pinned to a
#    full commit SHA / digest. Keep it that way when bumping versions.
# 2. [N/A WHILE PRIVATE — verified 2026-07-03] First-contributor approval:
#    GitHub rejects fork-PR approval settings on private repos (422); the
#    threat it bounds (hostile fork PRs) can't reach a private repo. MUST
#    be enabled the day this repo goes public.
# 3. [BLOCKED BY PLAN — verified 2026-07-03] Branch protection AND rulesets
#    on a free-plan private repo both return 403 (need GitHub Pro or a
#    public repo). Human decision: upgrade, go public, or defer. When
#    unblocked: require every check (quality, meta, test, build,
#    security, pack, the four preview legs, preview-unsupported-node),
#    branches up to date before merge, enforce_admins OFF /
#    admin bypass ON so the solo direct-push flow keeps working.
# 4. [DONE — verified 2026-07-03 via gh api] Default GITHUB_TOKEN is
#    read-only repo-wide, can_approve_pull_request_reviews=false (the
#    permissions block below also enforces it per-workflow).
# 5. [DONE 2026-08-03] Full-history privacy audit passed; HANDOFF.md and
#    LEARNINGS.md stay public by decision (spec §18) under the CLAUDE.md
#    public-safe writing rule. Items 2-3 completed at the public flip.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the auto-generated GITHUB_TOKEN, workflow-wide.
permissions:
  contents: read

# Superseded runs of the same branch/PR are cancelled, not stacked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Spec drift check (conduitspec.md is derived from the HTML)
        run: |
          python3 html2md.py conduitspec.html /tmp/spec-regen.md
          cmp /tmp/spec-regen.md conduitspec.md

  meta:
    name: Shell + workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: shellcheck the git hooks and repo scripts
        run: >
          shellcheck githooks/* scripts/push-docs scripts/routing-lib.sh
          scripts/pack-preview scripts/check-absent scripts/check-tarball-paths
          scripts/check-shrinkwrap-installed scripts/check-shrinkwrap-in-pnpm
      - name: actionlint (lints this workflow itself)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

  security:
    name: Audit + secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
          persist-credentials: false
      # The lockfile-review policy (CLAUDE.md) made visible: if a PR touches
      # supply-chain-sensitive files, surface it loudly in the checks UI.
      # Warning, not failure — legitimate dep changes are normal; the point
      # is that a human can't miss that this diff needs the careful read.
      - name: Flag supply-chain-sensitive changes for human review
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
            pnpm-lock.yaml pnpm-workspace.yaml githooks/ .github/ package.json 'packages/*/package.json')
          if [ -n "$changed" ]; then
            echo "::warning title=Supply-chain review required::PR modifies: $(echo "$changed" | tr '\n' ' ')"
            {
              echo "## ⚠️ Supply-chain-sensitive files changed"
              echo '```'
              echo "$changed"
              echo '```'
              echo "Review these like code (CLAUDE.md security posture): lockfile"
              echo "diffs, allowBuilds, hooks, CI workflows, dependency manifests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Gitleaks binary directly — needs no token, prints redacted findings.
      - name: Secrets scan (full history)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --no-banner --redact
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fail only on high/critical; low/moderate noise gets reviewed, not churned.
      - run: pnpm audit --audit-level high

  pack:
    name: Pack preview tarball (once)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack, then record the tarball and its SHA-256
        id: pack
        run: |
          # No pipe: the step captures the script's exit status itself, so a
          # failed pack fails THIS step, and pack.log (stdout) is printed.
          status=0
          scripts/pack-preview "$RUNNER_TEMP/preview" > "$RUNNER_TEMP/pack.log" || status=$?
          tarball="$(tail -n 1 "$RUNNER_TEMP/pack.log")"
          if [ "$status" -ne 0 ] || [ ! -f "$tarball" ] || [ ! -f "$tarball.sha256" ]; then
            echo "[pack] Pack failed: pack-preview exited $status or wrote no tarball and checksum. Context: { tarball: $tarball }" >&2
            echo "--- pack-preview stdout (pack.log):" >&2
            cat "$RUNNER_TEMP/pack.log" >&2
            exit 1
          fi
          echo "sha256=$(cut -d ' ' -f 1 "$tarball.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-tarball
          path: ${{ runner.temp }}/preview/conduithq-cli-*
          if-no-files-found: error

  preview:
    name: Preview tarball (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The engines floor, exactly, and the current LTS line (D-R12).
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          # The Node 24 legs test the newest 24.x, not a cached older one.
          check-latest: ${{ matrix.node == '24' }}
      - name: This leg is the target the notes claim (Linux x64 glibc / macOS arm64)
        env:
          OS: ${{ matrix.os }}
        run: |
          # shellcheck disable=SC2016 # single quotes are intended: ${...} is a JS template literal.
          node -e '
            const want = process.env.OS.startsWith("ubuntu")
              ? { platform: "linux", arch: "x64", glibc: true }
              : { platform: "darwin", arch: "arm64", glibc: false };
            const glibc = Boolean(process.report.getReport().header.glibcVersionRuntime);
            const got = { platform: process.platform, arch: process.arch, glibc };
            if (JSON.stringify(got) !== JSON.stringify(want)) {
              console.error(`[preview] Runner target mismatch. Context: { want: ${JSON.stringify(want)}, got: ${JSON.stringify(got)} }`);
              process.exit(1);
            }
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-tarball
          path: ${{ runner.temp }}/preview
      - name: The downloaded tarball is the exact bytes the pack job built
        env:
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: |
          tarball="$(ls "$RUNNER_TEMP"/preview/conduithq-cli-*.tgz)"
          actual="$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$tarball")"
          test -n "$EXPECTED"
          test "$actual" = "$EXPECTED"
          scripts/check-tarball-paths "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Extract the tarball into a fresh folder, npm ci its lockfile, link the bins (the adopter commands)
        run: |
          # mkdir without -p: the folder must not exist yet.
          mkdir "$RUNNER_TEMP/install"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install/package"
          mv npm-shrinkwrap.json package-lock.json
          npm ci --omit=dev --ignore-scripts
          mkdir "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/install/package/dist/conduit.js" "$RUNNER_TEMP/bin/conduit"
          ln -s "$RUNNER_TEMP/install/package/dist/bin.js" "$RUNNER_TEMP/bin/conduit-mcp"
      - name: npm ci installed exactly the lockfile's tree
        run: scripts/check-shrinkwrap-installed "$RUNNER_TEMP/install/package"
      - name: conduit demo neither opens nor creates the state path, and ignores CONDUIT_DB, CONDUIT_MASTER_KEY, and the egress env var
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          state="$(node -p 'require("node:path").join(require("node:os").userInfo().homedir, ".conduit")')"
          "$GITHUB_WORKSPACE/scripts/check-absent" "$state"
          # Each command runs in its own assignment, so set -e sees its exit status.
          got="$(conduit --version)"
          want="$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")"
          if [ "$got" != "$want" ]; then
            echo "[preview] conduit --version mismatch. Context: { got: $got, want: $want }" >&2
            exit 1
          fi
          # A FILE where the state dir would be, unreadable: any open fails
          # (EACCES) and any mkdir fails (EEXIST), so a demo that opens or
          # creates state cannot PASS. It does NOT catch a bare stat/exists.
          # Egress is forced OFF in the env: the demo's loopback grant is in
          # code, so a demo that wrongly takes egress from the env fails here.
          printf 'sentinel' > "$state"
          chmod 000 "$state"
          CONDUIT_DB=/nonexistent/conduit.db CONDUIT_MASTER_KEY=not-a-key CONDUIT_UNSAFE_ALLOW_PRIVATE_EGRESS=0 conduit demo
          chmod 600 "$state"
          test "$(cat "$state")" = "sentinel"
          rm "$state"
      - name: A real daemon auto-starts from the installed tarball
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          conduit key generate
          listed="$(conduit approvals list)"
          if [ "$listed" != "No paused executions awaiting approval." ]; then
            echo "[preview] conduit approvals list mismatch. Context: { got: $listed }" >&2
            exit 1
          fi
          conduit daemon status
          conduit daemon stop
      - name: The installed conduit-mcp doctor runs (the notes advertise it)
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          conduit-mcp --doctor --offline

  preview-unsupported-node:
    name: Preview tarball refuses an unsupported Node (20)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-tarball
          path: ${{ runner.temp }}/preview
      - name: The downloaded tarball is the exact bytes the pack job built
        env:
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: |
          tarball="$(ls "$RUNNER_TEMP"/preview/conduithq-cli-*.tgz)"
          actual="$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync(process.argv[1])).digest("hex"))' "$tarball")"
          test -n "$EXPECTED"
          test "$actual" = "$EXPECTED"
          scripts/check-tarball-paths "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Install (npm only warns on engines) and expect the guard's one-line refusal
        working-directory: ${{ runner.temp }}
        run: |
          mkdir "$RUNNER_TEMP/install"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/install"
          mv "$RUNNER_TEMP/install/package/npm-shrinkwrap.json" "$RUNNER_TEMP/install/package/package-lock.json"
          (cd "$RUNNER_TEMP/install/package" && npm ci --omit=dev --ignore-scripts)
          mkdir "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/install/package/dist/conduit.js" "$RUNNER_TEMP/bin/conduit"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          set +e
          conduit --version > out.txt 2> err.txt
          code=$?
          set -e
          # On any failed assertion below, show what the guard printed.
          report() {
            echo "[preview] Node-guard check failed. Context: { exit: $code }" >&2
            echo "--- stdout (out.txt):" >&2
            cat out.txt >&2
            echo "--- stderr (err.txt):" >&2
            cat err.txt >&2
          }
          trap report ERR
          test "$code" = "1"
          test ! -s out.txt
          test "$(wc -l < err.txt)" -eq 1
          grep -qE '^\[conduit\] Node 20\.[0-9]+\.[0-9]+ is not supported: .* Notes: https://github\.com/.+/INSTALL\.md$' err.txt

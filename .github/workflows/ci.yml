# CI pipeline draft — to activate:
#   mkdir -p .github/workflows && git mv .github/ci.draft.yml .github/workflows/ci.yml
# (Workflow files are deliberately not agent-writable on this machine; a human
# moves this into place. Review it like code — CI is a supply-chain surface.)
#
# THREAT MODEL (read before editing):
# - pull_request runs UNTRUSTED code. A PR can modify package scripts, test
#   files, pnpm-workspace.yaml (allowBuilds), and the lockfile — so every job
#   here is an unprivileged validation surface: read-only token, zero
#   `secrets.*` references, installs with --ignore-scripts, checkout
#   credentials not persisted.
# - NEVER switch any trigger to pull_request_target. Never add secrets, deploy
#   credentials, cloud creds, or publish tokens to this file. Privileged
#   workflows (publish, deploy) belong in a separate push/tag-triggered
#   workflow that never runs PR code.
# ACTIVATION CHECKLIST (do these in repo settings when this goes live —
# none of them can be configured from inside this file):
# 1. [DONE 2026-07-03] Every `uses:` and docker image below is pinned to a
#    full commit SHA / digest. Keep it that way when bumping versions.
# 2. [N/A WHILE PRIVATE — verified 2026-07-03] First-contributor approval:
#    GitHub rejects fork-PR approval settings on private repos (422); the
#    threat it bounds (hostile fork PRs) can't reach a private repo. MUST
#    be enabled the day this repo goes public.
# 3. [BLOCKED BY PLAN — verified 2026-07-03] Branch protection AND rulesets
#    on a free-plan private repo both return 403 (need GitHub Pro or a
#    public repo). Human decision: upgrade, go public, or defer. When
#    unblocked: require all five checks (quality, meta, test, build,
#    security), branches up to date before merge, enforce_admins OFF /
#    admin bypass ON so the solo direct-push flow keeps working.
# 4. [DONE — verified 2026-07-03 via gh api] Default GITHUB_TOKEN is
#    read-only repo-wide, can_approve_pull_request_reviews=false (the
#    permissions block below also enforces it per-workflow).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the auto-generated GITHUB_TOKEN, workflow-wide.
permissions:
  contents: read

# Superseded runs of the same branch/PR are cancelled, not stacked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Spec drift check (conduitspec.md is derived from the HTML)
        run: |
          python3 html2md.py conduitspec.html /tmp/spec-regen.md
          cmp /tmp/spec-regen.md conduitspec.md

  meta:
    name: Shell + workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: shellcheck the git hooks and repo scripts
        run: shellcheck githooks/* scripts/*
      - name: actionlint (lints this workflow itself)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

  security:
    name: Audit + secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
          persist-credentials: false
      # The lockfile-review policy (CLAUDE.md) made visible: if a PR touches
      # supply-chain-sensitive files, surface it loudly in the checks UI.
      # Warning, not failure — legitimate dep changes are normal; the point
      # is that a human can't miss that this diff needs the careful read.
      - name: Flag supply-chain-sensitive changes for human review
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
            pnpm-lock.yaml pnpm-workspace.yaml githooks/ .github/ package.json 'packages/*/package.json')
          if [ -n "$changed" ]; then
            echo "::warning title=Supply-chain review required::PR modifies: $(echo "$changed" | tr '\n' ' ')"
            {
              echo "## ⚠️ Supply-chain-sensitive files changed"
              echo '```'
              echo "$changed"
              echo '```'
              echo "Review these like code (CLAUDE.md security posture): lockfile"
              echo "diffs, allowBuilds, hooks, CI workflows, dependency manifests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Gitleaks binary directly — needs no token, prints redacted findings.
      - name: Secrets scan (full history)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --no-banner --redact
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fail only on high/critical; low/moderate noise gets reviewed, not churned.
      - run: pnpm audit --audit-level high
